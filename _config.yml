# renatogusani.com
# ========================================================================================
# A hand written Jekyll site. No theme: the layouts in _layouts and the single
# stylesheet in assets/css/main.scss are the whole front end.
#
# All copy on this site must trace back to cv-reference.md.

url:                   https://renatogusani.com
baseurl:               ''
lang:                  en

title:                 Renato Gusani
# Used by jekyll-seo-tag in the home page <title>, so it reads as a search result.
tagline:               Security Engineer at IBM, Founder of VNTA Group, Dublin
description:           >
  Security engineer at IBM Security, building Python and MCP tooling for attack
  surface management. Founder of VNTA Group. Dublin, Ireland.

author:
  name:                Renato Gusani
  email:               renato@vnta.xyz

# The card image for Google, LinkedIn, Slack and iMessage previews. Applied to
# every page through `defaults` below, since jekyll-seo-tag reads it per page.
image:                 /assets/img/og.png

twitter:
  card:                summary_large_image

# Feeds the Person structured data in _includes/schema.html.
person:
  job_title:           Security Engineer
  employer:            IBM
  employer_url:        https://www.ibm.com/
  alumni_of:           National College of Ireland
  alumni_of_url:       https://www.ncirl.ie/
  locality:            Dublin
  country:             IE
  knows_about:
    - Attack surface management
    - Detection engineering
    - Security automation
    - Python
    - Model Context Protocol
    - Threat analysis
    - Data science
  same_as:
    - https://www.linkedin.com/in/rgusani/
    - https://github.com/renatogusani
    - https://spacexplorer.info

# Dark only. Used for the browser UI colour and the app manifest splash.
# Matches $bg in assets/css/main.scss.
theme_color:           '#000000'
background_color:      '#000000'

permalink:             /:title/

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path:            ''
    values:
      image:           /assets/img/og.png
  - scope:
      path:            assets/
    values:
      sitemap:         false

exclude:
  - .jekyll-cache
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  # Source material for the copy, not a page.
  - cv-reference.md

sass:
  style:               compressed
